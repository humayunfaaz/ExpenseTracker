<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>💰 Expense Tracker</h1>
            <p>Manage your finances seamlessly</p>
        </header>

        <!-- Add Expense Form Card -->
        <section class="card form-card">
            <h2>Add New Expense</h2>
            <form id="expenseForm">
                <div class="form-group">
                    <label for="amount">Amount ( ₹)</label>
                    <input type="number" id="amount" step="0.01" placeholder="45.50" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="" disabled selected>Select category</option>
                        <option value="1">Food</option>
                        <option value="2">Travel</option>
                        <option value="3">Education</option>
                        <option value="4">Shopping</option>
                        <option value="5">Entertainment</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group full-width">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g., Grocery shopping">
                </div>
                <button type="submit" class="btn">Add Expense</button>
            </form>
        </section>

        <!-- Expenses Table Card -->
        <section class="card table-card">
            <h2>Recent Expenses</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody id="expenseTableBody">
                        <!-- Data from Node.js / MySQL will load here -->
                        <tr>
                            <td>1</td>
                            <td>Alex Smith</td>
                            <td><span class="badge food">Food</span></td>
                            <td> ₹0</td>
                            <td>2026-06-01</td>
                            <td>Lunch with a client</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Alex Smith</td>
                            <td><span class="badge shopping">Shopping</span></td>
                            <td> ₹120.00</td>
                            <td>2026-06-02</td>
                            <td>New running shoes</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
